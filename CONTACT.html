<body class="contact-page-body">

    <div class="main">
        <div class="navbar">
            <div class="icon">
            </div>

            <div class="menu">

                <div class="logo">
                    <p><b> DBARRANDA </b></p>
                </div>

                <ul>
                    <li><a href="index.html"> HOME </a></li>

                    <li><a href="CONTACT.html" class="active"> CONTACT </a></li>
                </ul>
            </div>
        </div>

    </div>

    <div class="contact-page">
        <div class="contact-header">
            <h1 class="description">Contact Me</h1>
            <p class="note">For any queries, feel free to reach out through my socials, or leave a comment below.</p>
        </div>

        <div class="contact-columns">
            <div class="contact-main">
                <div class="comments-wrapper">
                    <h2>Leave a Comment</h2>
                    <p class="comments-subtitle">Visiting the site? Drop a note below — I read every one.</p>

                    <form id="comment-form" class="comment-form">
                        <div class="comment-form-row">
                            <input type="text" id="comment-name" name="name" placeholder="Your name" maxlength="60" required>
                        </div>
                        <div class="comment-form-row">
                            <textarea id="comment-message" name="message" rows="3" placeholder="Write your comment..." maxlength="500" required></textarea>
                        </div>
                        <div class="comment-form-actions">
                            <button type="submit" class="comment-submit-btn">Post Comment</button>
                            <span id="comment-form-status" class="comment-form-status"></span>
                        </div>
                    </form>

                    <div id="comments-list" class="comments-list">
                        <p class="comments-loading">Loading comments…</p>
                    </div>
                </div>
            </div>

            <aside class="contact-side">
                <div class="img-box">
                    <img src="bg_pattern.png" class="bg">
                    <img src="me_noBG.png" class="meee">
                </div>

                <div class="social-menu">
                    <ul>
                        <li><a href="https://www.facebook.com/danielanicole.barranda"><i class="fa fa-facebook"></i></a></li>
                        <li><a href="https://www.instagram.com/_dbarranda/?hl=en"><i class="fa fa-instagram"></i></a></li>
                        <li><a href="https://github.com/DanielaBarranda"><i class="fa fa-github"></i></a></li>
                        <li><a href="https://www.linkedin.com/in/daniela-nicole-barranda-4a1281239/"><i class="fa fa-linkedin"></i></a></li>
                        <li><a href="mailto:barrandadaniela@gmail.com"><i class="fa fa-envelope"></i></a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
